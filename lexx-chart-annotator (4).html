<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXX — Технічний аналіз</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f1f5f9;color:#1e293b;font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:#fff;border-bottom:2px solid #e2e8f0;padding:0 14px;display:flex;align-items:center;height:48px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06);gap:0}
.logo{font-size:14px;font-weight:700;color:#1e293b;letter-spacing:1px;margin-right:16px;white-space:nowrap}
.logo span{color:#2563eb}
.tab-bar{display:flex;height:48px;overflow-x:auto;flex:1;min-width:0}
.tab{padding:0 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:#1e293b}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:600}
.tab.locked{color:#94a3b8}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.btn{font-size:11px;font-weight:600;padding:6px 13px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-upload{background:#fff;color:#2563eb;border:1px solid #93c5fd}.btn-upload:hover{background:#eff6ff}
.btn-save{background:#2563eb;color:#fff;border:none}.btn-save:hover{opacity:.88}
.btn-clear{background:#fff;color:#ef4444;border:1px solid #fca5a5}.btn-clear:hover{background:#fef2f2}
.toolbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 12px;display:flex;align-items:center;height:50px;flex-shrink:0;overflow-x:auto;gap:0}
.tgrp{display:flex;gap:2px;align-items:center;flex-shrink:0}
.tsep{width:1px;height:26px;background:#e2e8f0;margin:0 8px;flex-shrink:0}
.tbtn{width:38px;height:38px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;color:#475569}
.tbtn:hover{background:#f1f5f9;border-color:#cbd5e1}
.tbtn.active{background:#eff6ff;border-color:#93c5fd;color:#2563eb}
.tbtn svg{width:18px;height:18px}
.cbtn{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.cbtn.active{border-color:#1e293b;box-shadow:0 0 0 1px #1e293b}
.sbtn{padding:3px 10px;border-radius:5px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;flex-shrink:0}
.sbtn.active{background:#eff6ff;border-color:#93c5fd;color:#2563eb}
.li{display:flex;align-items:center;gap:6px;flex-shrink:0}
.li-txt{font-size:11px;font-weight:600;color:#94a3b8;white-space:nowrap}
.li-inp{background:#f8fafc;border:1px solid #e2e8f0;color:#1e293b;font-family:'Inter',sans-serif;font-size:12px;padding:5px 10px;border-radius:6px;width:155px;outline:none}
.li-inp:focus{border-color:#93c5fd;background:#fff}
.li-inp::placeholder{color:#cbd5e1}
.ubtn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:5px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.ubtn:hover{border-color:#93c5fd;color:#2563eb}
.ws{flex:1;display:flex;overflow:hidden;min-height:0}
.cw{flex:1;overflow:auto;background:#d1d5db;display:flex;align-items:flex-start;justify-content:flex-start}
#mc{display:block;cursor:crosshair;box-shadow:0 2px 16px rgba(0,0,0,.15)}
.tp{width:220px;background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.tph{padding:12px 14px 8px;border-bottom:1px solid #e2e8f0}
.tpt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#2563eb}
.tpl{flex:1;overflow-y:auto;padding:8px 10px}
.ti{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;line-height:1.5;color:#334155;border-left:3px solid #e2e8f0}
.tit{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;display:block;margin-bottom:2px}
.tin{font-weight:700;color:#2563eb}
.te{font-size:12px;color:#cbd5e1;padding:12px 0;text-align:center}
.tpf{padding:8px 10px;border-top:1px solid #e2e8f0;display:flex;gap:6px}
.txp{display:none;position:fixed;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.12);min-width:230px}
.txp input{background:#f8fafc;border:1px solid #e2e8f0;color:#1e293b;font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;border-radius:6px;width:100%;outline:none;display:block;margin-bottom:10px}
.txp input:focus{border-color:#93c5fd}
.pb{display:flex;gap:6px}
.pok{flex:1;background:#2563eb;color:#fff;border:none;font-size:12px;font-weight:600;padding:8px;border-radius:5px;cursor:pointer}
.pcn{flex:1;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;font-size:12px;font-weight:600;padding:8px;border-radius:5px;cursor:pointer}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;align-items:center;justify-content:center}
.ov.show{display:flex}
.md{background:#fff;border-radius:10px;padding:28px 30px;max-width:340px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.md-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2563eb;margin-bottom:5px}
.md-s{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:18px}
.md input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;color:#1e293b;font-size:14px;padding:9px 12px;border-radius:6px;outline:none;margin-bottom:8px;font-family:Inter,sans-serif}
.md input:focus{border-color:#93c5fd}
.md-e{color:#ef4444;font-size:12px;min-height:18px;margin-bottom:10px}
.md-b{display:flex;gap:8px}
.md-b button:first-child{flex:1;background:#2563eb;color:#fff;border:none;font-size:13px;font-weight:600;padding:9px;border-radius:6px;cursor:pointer}
.md-b button:last-child{flex:1;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;font-size:13px;font-weight:600;padding:9px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">LEXX <span>International</span></div>
  <div class="tab-bar" id="tabBar"></div>
  <div class="hdr-right">
    <button class="btn btn-upload" onclick="triggerUpload()">+ Свій графік</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleUpload(event)">
    <button class="btn btn-clear"  onclick="clearCanvas()">Очистити</button>
    <button class="btn btn-save"   onclick="saveImage()">↓ PNG</button>
  </div>
</div>
<div class="toolbar">
  <div class="tgrp">
    <button class="tbtn active" id="tool-arrow"  onclick="setTool('arrow')"  title="Стрілка (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg></button>
    <button class="tbtn" id="tool-line"   onclick="setTool('line')"   title="Лінія (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg></button>
    <button class="tbtn" id="tool-hline"  onclick="setTool('hline')"  title="Горизонталь (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="8" x2="3" y2="16" stroke-width="1.5"/><line x1="21" y1="8" x2="21" y2="16" stroke-width="1.5"/></svg></button>
    <button class="tbtn" id="tool-rect"   onclick="setTool('rect')"   title="Прямокутник (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="tbtn" id="tool-text"   onclick="setTool('text')"   title="Текст (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="12" y1="7" x2="12" y2="20"/></svg></button>
    <button class="tbtn" id="tool-select" onclick="setTool('select')" title="Переміщення (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-7 1-4 7z"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tgrp">
    <div class="cbtn active" id="col-red"   style="background:#ef4444" onclick="setColor('#ef4444','col-red')">R</div>
    <div class="cbtn"        id="col-green" style="background:#16a34a" onclick="setColor('#16a34a','col-green')">G</div>
    <div class="cbtn"        id="col-black" style="background:#1e293b" onclick="setColor('#1e293b','col-black')">B</div>
  </div>
  <div class="tsep"></div>
  <div class="tgrp">
    <button class="sbtn active" id="sz-s" onclick="setSize(2,'sz-s')">S</button>
    <button class="sbtn"        id="sz-m" onclick="setSize(3,'sz-m')">M</button>
    <button class="sbtn"        id="sz-l" onclick="setSize(5,'sz-l')">L</button>
  </div>
  <div class="tsep"></div>
  <div class="li">
    <span class="li-txt">Підпис</span>
    <input class="li-inp" id="labelInput" placeholder="напр. Gap продовження…"/>
  </div>
  <div class="tsep"></div>
  <div class="tgrp">
    <button class="ubtn" onclick="undo()">↩ Undo</button>
    <button class="ubtn" onclick="redo()">Redo ↪</button>
  </div>
</div>
<div class="ws">
  <div class="cw"><canvas id="mc"></canvas></div>
  <div class="tp">
    <div class="tph"><div class="tpt" id="taskTitle">Завдання</div></div>
    <div class="tpl" id="taskList"></div>
    <div class="tpf">
      <button class="ubtn" style="flex:1;justify-content:center" onclick="undo()">↩ Undo</button>
      <button class="ubtn" style="flex:1;justify-content:center" onclick="redo()">Redo ↪</button>
    </div>
  </div>
</div>
<div class="txp" id="txp">
  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin-bottom:8px">Підпис</div>
  <input type="text" id="txpIn" placeholder="Введіть назву…"/>
  <div class="pb"><button class="pok" onclick="confirmText()">OK</button><button class="pcn" onclick="cancelText()">Скасувати</button></div>
</div>
<div class="ov" id="pwOv">
  <div class="md">
    <div class="md-t">LEXX International</div>
    <div class="md-s">Введіть пароль для доступу до тесту</div>
    <input type="password" id="pwIn" placeholder="Пароль…" onkeydown="if(event.key===&apos;Enter&apos;)checkPw()"/>
    <div class="md-e" id="pwErr"></div>
    <div class="md-b"><button onclick="checkPw()">Увійти</button><button onclick="closePw()">Скасувати</button></div>
  </div>
</div>

let drawing=false,startX=0,startY=0,curX=0,curY=0;
let selIdx=-1,dragOff={x:0,y:0};
let txPending=null;

const canvas=document.getElementById('mc');
const ctx=canvas.getContext('2d');

// ── helpers ──────────────────────────
const slide   = (id=curId) => SLIDES.find(s=>s.id===id);
const ensure  = id => {
  if(!shapes[id])  shapes[id]=[];
  if(!undoSt[id])  undoSt[id]=[];
  if(!redoSt[id])  redoSt[id]=[];
};

// ══════════════════════════════════════
// TABS
// ══════════════════════════════════════
function buildTabs(){
  const bar=document.getElementById('tabBar');
  bar.innerHTML='';
  SLIDES.forEach(s=>{
    const b=document.createElement('button');
    b.className='tab'+(s.id===curId?' active':'')+(s.locked?' locked':'');
    b.textContent=s.tab+(s.locked?' 🔒':'');
    b.onclick=()=>{
      if(s.locked)         openPw();
      else if(s.uploadPh)  triggerUpload();
      else                 switchTo(s.id);
    };
    bar.appendChild(b);
  });
}

// ══════════════════════════════════════
// SWITCH
// ══════════════════════════════════════
function switchTo(id){
  curId=id;
  ensure(id);
  buildTabs();
  renderSlide();
}

// ══════════════════════════════════════
// RENDER — uses bgCache[id]; loads image
// once and caches it permanently by id
// ══════════════════════════════════════
function renderSlide(){
  const s=slide();
  // task panel
  document.getElementById('taskTitle').textContent=
    s.tab.replace(/^[^\w\u0400-\u04FF]*/,'').trim();
  const list=document.getElementById('taskList');
  list.innerHTML = (!s.tasks||!s.tasks.length)
    ? '<div class="te">Вільна практика</div>'
    : s.tasks.map(t=>`<div class="ti">
        <span class="tit">${t.type}</span>
        <span class="tin">${t.num}.</span> ${t.text}</div>`).join('');

  // image
  if(bgCache[s.id]){
    // already loaded — draw immediately
    setupCanvas(bgCache[s.id]);
  } else if(s.src==='__SPY__'){
    const img=makeSPY();
    img.onload=()=>{bgCache[s.id]=img;if(curId===s.id)setupCanvas(img);};
  } else if(s.src){
    const img=new Image();
    img.onload=()=>{bgCache[s.id]=img;if(curId===s.id)setupCanvas(img);};
    img.src=s.src;
  } else {
    // no image — blank canvas with message
    canvas.width=800;canvas.height=500;
    ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,800,500);
    ctx.fillStyle='#94a3b8';ctx.font='14px Inter,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Клацніть «+ Свій графік» або виберіть вкладку з графіком',400,250);
  }
}

function setupCanvas(img){
  canvas.width =img.naturalWidth ||img.width ||960;
  canvas.height=img.naturalHeight||img.height||540;
  redraw();
}

// ══════════════════════════════════════
// SPY CHART (canvas-drawn realistic 1Y)
// ══════════════════════════════════════
function makeSPY(){
  const W=1200,H=600;
  const oc=document.createElement('canvas');
  oc.width=W;oc.height=H;
  const c=oc.getContext('2d');

  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);

  // Approximate SPY daily data 1Y (Jan 2024 – Jan 2025)
  // Range ~460 to ~595
  const seed=17;
  const rng=s=>{let x=Math.sin(s+1)*43758.5453;return x-Math.floor(x);};
  const raw=[];
  let p=467;
  // trend data mimicking real SPY movement
  const trm=[.15,.12,.08,.06,.10,-.04,.06,.14,.18,.12,-.06,-.10,.08,.12,.16];
  for(let i=0;i<252;i++){
    const mo=Math.floor(i/21);
    const tr=(trm[mo]||0.08)/21;
    const noise=(rng(seed+i*7.31)-0.48)*1.8;
    p=Math.max(455,Math.min(600,p+tr+noise));
    raw.push(+p.toFixed(2));
  }
  // plant some clear gaps
  raw[22]=raw[21]+3.8; raw[23]=raw[22]+1.2;   // gap up
  raw[68]=raw[67]-4.2; raw[69]=raw[68]-1.1;   // gap down
  raw[120]=raw[119]+5.1; raw[121]=raw[120]+2;  // gap up
  raw[155]=raw[154]-3.5;                        // gap down
  raw[200]=raw[199]+4.6; raw[201]=raw[200]+1.8;// gap up
  raw[230]=raw[229]-5.2; raw[231]=raw[230]-1.4;// gap down

  const mn=Math.min(...raw)-6,mx=Math.max(...raw)+6;
  const PL=72,PR=72,PT=44,PB=78;
  const CW=W-PL-PR,CH=H-PT-PB;
  const BW=CW/252;
  const sy=v=>PT+CH-(v-mn)/(mx-mn)*CH;

  // grid lines + price labels
  c.strokeStyle='#f0f4f8';c.lineWidth=1;
  const steps=8;
  for(let i=0;i<=steps;i++){
    const v=mn+i*(mx-mn)/steps;
    const y=sy(v);
    c.beginPath();c.moveTo(PL,y);c.lineTo(W-PR,y);c.stroke();
    c.fillStyle='#94a3b8';c.font='11px Inter,sans-serif';c.textAlign='right';
    c.fillText(v.toFixed(0),PL-6,y+4);
  }

  // month labels
  const mlabels=["Jan24","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan25"];
  mlabels.forEach((m,i)=>{
    const xi=i*21;if(xi>=252)return;
    const x=PL+xi*BW;
    c.strokeStyle='#f0f4f8';c.lineWidth=1;
    c.beginPath();c.moveTo(x,PT);c.lineTo(x,PT+CH);c.stroke();
    c.fillStyle='#64748b';c.font='10px Inter,sans-serif';c.textAlign='center';
    c.fillText(m,x,PT+CH+16);
  });

  // volume bars (bottom strip)
  const vols=raw.map((_,i)=>Math.floor((rng(seed+i*3.7)*.7+.3)*280));
  const maxV=Math.max(...vols);
  raw.forEach((_,i)=>{
    const x=PL+i*BW;
    const up=i===0||raw[i]>=raw[i-1];
    c.fillStyle=up?'rgba(22,163,74,.18)':'rgba(239,68,68,.18)';
    const vh=(vols[i]/maxV)*45;
    c.fillRect(x+BW*.1,H-PB+5,BW*.8,vh);
  });

  // candles
  raw.forEach((cl,i)=>{
    const x=PL+i*BW+BW/2;
    const op=i===0?cl:raw[i-1]+(cl-raw[i-1])*.15;
    const hi=Math.max(op,cl)+(rng(seed+i*1.9)*.7+.2);
    const lo=Math.min(op,cl)-(rng(seed+i*2.7)*.5+.15);
    const up=cl>=op;
    c.strokeStyle=up?'#16a34a':'#ef4444';
    c.fillStyle  =up?'#16a34a':'#ef4444';
    c.lineWidth=.9;
    c.beginPath();c.moveTo(x,sy(hi));c.lineTo(x,sy(lo));c.stroke();
    const bh=Math.max(Math.abs(sy(op)-sy(cl)),1.5);
    c.fillRect(x-BW*.35,Math.min(sy(op),sy(cl)),BW*.7,bh);
  });

  // border
  c.strokeStyle='#e2e8f0';c.lineWidth=1;
  c.strokeRect(PL,PT,CW,CH);

  // title
  c.fillStyle='#1e293b';c.font='bold 13px Inter,sans-serif';c.textAlign='left';
  c.fillText('SPY  —  SPDR S&P 500 ETF  |  Daily  |  1 рік  (схематичний)',PL,26);
  c.fillStyle='#94a3b8';c.font='11px Inter,sans-serif';
  c.fillText('Пробний графік для відпрацювання інструментів анотації',PL,H-12);

  // current price label
  const lastP=raw[raw.length-1];
  const ly=sy(lastP);
  c.fillStyle='#1e293b';c.fillRect(W-PR,ly-10,PR-2,20);
  c.fillStyle='#fff';c.font='bold 11px Inter,sans-serif';c.textAlign='center';
  c.fillText(lastP.toFixed(2),W-PR/2,ly+4);

  const img=new Image();
  img.src=oc.toDataURL('image/png');
  img.width=W;img.height=H;
  return img;
}

// ══════════════════════════════════════
// TOOLS
// ══════════════════════════════════════
function setTool(t){
  tool=t;selIdx=-1;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tool-'+t)?.classList.add('active');
  canvas.style.cursor=t==='select'?'default':'crosshair';
  redraw();
}
function setColor(c,id){
  color=c;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function setSize(s,id){
  lineSize=s;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}

// ══════════════════════════════════════
// CANVAS EVENTS
// ══════════════════════════════════════
canvas.addEventListener('mousedown',e=>{
  const p=pos(e);
  if(tool==='select'){
    selIdx=findShape(p.x,p.y);
    if(selIdx>=0){
      const s=shapes[curId][selIdx];
      dragOff={x:p.x-(s.x1??s.x??0),y:p.y-(s.y1??s.y??0)};
    }
    redraw();return;
  }
  if(tool==='text'){openTxp(p.x,p.y);return;}
  drawing=true;startX=p.x;startY=p.y;curX=p.x;curY=p.y;
});
canvas.addEventListener('mousemove',e=>{
  const p=pos(e);
  if(tool==='select'&&selIdx>=0&&e.buttons===1){
    const s=shapes[curId][selIdx];
    const ox=s.x1??s.x??0,oy=s.y1??s.y??0;
    const dx=p.x-dragOff.x-ox,dy=p.y-dragOff.y-oy;
    if('x1' in s){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;}
    else{s.x+=dx;s.y+=dy;}
    dragOff={x:p.x-(s.x1??s.x??0),y:p.y-(s.y1??s.y??0)};
    redraw();return;
  }
  if(!drawing)return;
  curX=p.x;curY=p.y;redraw();
  drawShape({type:tool,x1:startX,y1:startY,x2:curX,y2:curY,
    color,size:lineSize,label:document.getElementById('labelInput').value.trim()},false,true);
});
canvas.addEventListener('mouseup',e=>{
  if(!drawing)return;drawing=false;
  const p=pos(e);
  pushShape({type:tool,x1:startX,y1:startY,x2:p.x,y2:p.y,
    color,size:lineSize,label:document.getElementById('labelInput').value.trim()});
});
canvas.addEventListener('dblclick',e=>{
  if(tool==='select'&&selIdx>=0){
    const s=shapes[curId][selIdx];
    const v=prompt('Змінити підпис:',s.label||'');
    if(v!==null){s.label=v;redraw();}
  }
});
function pos(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(canvas.width/r.width),
          y:(e.clientY-r.top )*(canvas.height/r.height)};
}
function findShape(x,y){
  const sl=shapes[curId]||[];
  for(let i=sl.length-1;i>=0;i--){
    const s=sl[i];
    if(s.type==='text'){
      if(Math.abs(x-s.x)<100&&Math.abs(y-s.y)<20)return i;
    }else if(s.type==='rect'){
      if(x>=Math.min(s.x1,s.x2)&&x<=Math.max(s.x1,s.x2)&&
         y>=Math.min(s.y1,s.y2)&&y<=Math.max(s.y1,s.y2))return i;
    }else{
      const dx=s.x2-s.x1,dy=s.y2-s.y1;
      const t=Math.max(0,Math.min(1,((x-s.x1)*dx+(y-s.y1)*dy)/(dx*dx+dy*dy||1)));
      if(Math.hypot(x-s.x1-t*dx,y-s.y1-t*dy)<10)return i;
    }
  }
  return -1;
}

// ══════════════════════════════════════
// DRAW
// ══════════════════════════════════════
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const bg=bgCache[curId];
  if(bg)ctx.drawImage(bg,0,0,canvas.width,canvas.height);
  (shapes[curId]||[]).forEach((s,i)=>drawShape(s,i===selIdx,false));
}
function drawShape(s,sel=false,prev=false){
  ctx.save();
  ctx.strokeStyle=s.color||'#ef4444';
  ctx.fillStyle  =s.color||'#ef4444';
  ctx.lineWidth  =s.size||2;
  ctx.setLineDash([]);
  if(prev)ctx.globalAlpha=.5;
  if(sel){ctx.lineWidth=(s.size||2)+1;ctx.setLineDash([5,3]);}
  const{x1,y1,x2,y2,type,label,x,y}=s;
  if(type==='line'){
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }else if(type==='hline'){
    ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(canvas.width,y1);ctx.stroke();
  }else if(type==='rect'){
    const rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);
    ctx.globalAlpha=prev?.1:.18;ctx.fillRect(rx,ry,rw,rh);
    ctx.globalAlpha=prev?.5:1;ctx.setLineDash([]);ctx.strokeRect(rx,ry,rw,rh);
  }else if(type==='arrow'){
    const a=Math.atan2(y2-y1,x2-x1),hw=Math.max((s.size||2)*3,10);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hw*Math.cos(a-.42),y2-hw*Math.sin(a-.42));
    ctx.lineTo(x2-hw*Math.cos(a+.42),y2-hw*Math.sin(a+.42));
    ctx.closePath();ctx.fill();
  }else if(type==='text'){
    ctx.setLineDash([]);
    ctx.font=`bold ${12+(s.size||2)*1.5}px Inter,sans-serif`;
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;
    ctx.strokeText(s.label||'',s.x,s.y);
    ctx.fillStyle=s.color||'#ef4444';ctx.fillText(s.label||'',s.x,s.y);
    if(sel){
      ctx.strokeStyle='rgba(37,99,235,.5)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      const m=ctx.measureText(s.label||'');ctx.strokeRect(s.x-4,s.y-16,m.width+8,22);
    }
  }
  if(type!=='text'&&label){
    ctx.setLineDash([]);
    const lx=type==='hline'?12:(x1+x2)/2;
    const ly=type==='hline'?y1-8:Math.min(y1,y2)-8;
    ctx.font=`bold ${11+(s.size||2)}px Inter,sans-serif`;
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;ctx.strokeText(label,lx,ly);
    ctx.fillStyle=s.color||'#ef4444';ctx.fillText(label,lx,ly);
  }
  ctx.restore();
}

// ══════════════════════════════════════
// HISTORY
// ══════════════════════════════════════
function pushShape(s){
  ensure(curId);
  undoSt[curId].push(JSON.stringify(shapes[curId]));
  redoSt[curId]=[];
  shapes[curId].push(s);
  redraw();
}
function undo(){
  if(!(undoSt[curId]||[]).length)return;
  redoSt[curId].push(JSON.stringify(shapes[curId]));
  shapes[curId]=JSON.parse(undoSt[curId].pop());
  redraw();
}
function redo(){
  if(!(redoSt[curId]||[]).length)return;
  undoSt[curId].push(JSON.stringify(shapes[curId]));
  shapes[curId]=JSON.parse(redoSt[curId].pop());
  redraw();
}
function clearCanvas(){
  if(!confirm('Очистити всі позначки?'))return;
  ensure(curId);
  undoSt[curId].push(JSON.stringify(shapes[curId]));
  shapes[curId]=[];selIdx=-1;redraw();
}

// ══════════════════════════════════════
// TEXT
// ══════════════════════════════════════
function openTxp(x,y){
  txPending={x,y};
  const pop=document.getElementById('txp');
  const inp=document.getElementById('txpIn');
  inp.value=document.getElementById('labelInput').value||'';
  pop.style.display='block';
  const r=canvas.getBoundingClientRect();
  pop.style.left=Math.min(r.left+x*(r.width/canvas.width)+10,window.innerWidth-260)+'px';
  pop.style.top =Math.min(r.top+y*(r.height/canvas.height)+10,window.innerHeight-130)+'px';
  setTimeout(()=>inp.select(),40);
}
function confirmText(){
  const v=document.getElementById('txpIn').value.trim();
  if(v&&txPending)pushShape({type:'text',x:txPending.x,y:txPending.y,color,size:lineSize,label:v});
  cancelText();
}
function cancelText(){document.getElementById('txp').style.display='none';txPending=null;}
document.getElementById('txpIn').addEventListener('keydown',e=>{
  if(e.key==='Enter')confirmText();
  if(e.key==='Escape')cancelText();
});

// ══════════════════════════════════════
// UPLOAD
// Multiple uploads are safe: each gets
// a unique id. Placeholder remains until
// one of the placeholder clicks is used.
// ══════════════════════════════════════
function triggerUpload(){document.getElementById('fileInput').click();}
function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const src=ev.target.result;
    const newId='up_'+Date.now();
    const name='📂 '+file.name.replace(/\.\w+$/,'');

    // Pre-load image and cache by id before inserting slide
    const img=new Image();
    img.onload=()=>{
      bgCache[newId]=img;
      // Find upload_ph index (insert before it, keeping ph alive)
      // OR insert before locked tab if no ph
      const phIdx=SLIDES.findIndex(s=>s.uploadPh);
      const insertAt=phIdx>=0?phIdx:SLIDES.findIndex(s=>s.locked);
      SLIDES.splice(insertAt,0,{id:newId,tab:name,src,tasks:[],locked:false});
      buildTabs();
      switchTo(newId);
    };
    img.src=src;
  };
  reader.readAsDataURL(file);
  e.target.value=''; // allow re-selecting same file
}

// ══════════════════════════════════════
// PASSWORD
// ══════════════════════════════════════
function openPw(){
  document.getElementById('pwOv').classList.add('show');
  document.getElementById('pwIn').value='';
  document.getElementById('pwErr').textContent='';
  setTimeout(()=>document.getElementById('pwIn').focus(),80);
}
function closePw(){document.getElementById('pwOv').classList.remove('show');}
function checkPw(){
  const v=document.getElementById('pwIn').value.trim();
  if(!PASSWORDS.includes(v)){
    document.getElementById('pwErr').textContent='Невірний пароль';
    document.getElementById('pwIn').select();
    return;
  }
  closePw();

  // 1. Remove locked placeholder
  const li=SLIDES.findIndex(s=>s.locked);
  if(li>=0)SLIDES.splice(li,1);

  // 2. Remove upload placeholder
  const phi=SLIDES.findIndex(s=>s.uploadPh);
  if(phi>=0)SLIDES.splice(phi,1);

  // 3. Add test slides (only if not already present)
  TEST_SLIDES.forEach(ts=>{
    if(!SLIDES.find(s=>s.id===ts.id))SLIDES.push(ts);
  });

  buildTabs();

  // 4. Pre-load all test images then switch to first
  let loaded=0;
  const total=TEST_SLIDES.filter(ts=>ts.src&&!bgCache[ts.id]).length;
  if(total===0){switchTo('gaps');return;}

  TEST_SLIDES.forEach(ts=>{
    if(!ts.src||bgCache[ts.id])return;
    const img=new Image();
    img.onload=()=>{
      bgCache[ts.id]=img;
      loaded++;
      if(loaded===total)switchTo('gaps');
    };
    img.onerror=()=>{loaded++;if(loaded===total)switchTo('gaps');};
    img.src=ts.src;
  });
}

// ══════════════════════════════════════
// SAVE
// ══════════════════════════════════════
function saveImage(){
  const s=slide();
  const n=(s?.tab||'chart').replace(/[^\wа-яА-ЯёЁ]/g,'_').replace(/_+/g,'_');
  const a=document.createElement('a');
  a.download='LEXX_'+n+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}

// ══════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.ctrlKey&&e.key==='z'){undo();return;}
  if(e.ctrlKey&&e.key==='y'){redo();return;}
  if(e.key==='Delete'&&selIdx>=0){
    ensure(curId);
    undoSt[curId].push(JSON.stringify(shapes[curId]));
    shapes[curId].splice(selIdx,1);selIdx=-1;redraw();
  }
  const map={'a':'arrow','l':'line','h':'hline','r':'rect','t':'text','v':'select'};
  if(map[e.key])setTool(map[e.key]);
});

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
buildTabs();
switchTo('practice');
</script>
